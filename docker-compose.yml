services:
  server:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    volumes:
      # Persist the SQLite database and uploaded audio files across restarts
      - ./data/db:/app/data
      - ./data/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
