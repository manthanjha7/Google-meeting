<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finrep Meeting Intelligence — Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* ---- Transitions (Feature 17) ---- */
    .fade-in { animation: fadeIn 0.25s ease-out; }
    .slide-in { animation: slideIn 0.3s ease-out; }
    .slide-up { animation: slideUp 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(20px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .header {
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 18px; color: #a0a0ff; font-weight: 600; }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .search-box {
      padding: 8px 14px;
      background: #2a2a4a;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      width: 280px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: #4a4aff; }
    .search-box::placeholder { color: #666; }
    .filter-select {
      padding: 8px 12px;
      background: #2a2a4a;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #4a4aff; color: white; }
    .btn-primary:hover { background: #5c5cff; }
    .btn-secondary { background: #2a2a4a; color: #ccc; border: 1px solid #3a3a5a; }
    .btn-secondary:hover { background: #3a3a5a; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-danger { background: #8b2020; color: white; }
    .btn-danger:hover { background: #a02828; }
    .btn-icon { background: none; border: none; color: #888; cursor: pointer; padding: 4px 8px; font-size: 16px; transition: color 0.2s; }
    .btn-icon:hover { color: #e0e0e0; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .main { display: flex; height: calc(100vh - 57px); }
    .sidebar {
      width: 380px;
      min-width: 380px;
      background: #1a1a2e;
      border-right: 1px solid #2a2a4a;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .meeting-item {
      padding: 14px 18px;
      border-bottom: 1px solid #22224a;
      cursor: pointer;
      transition: background 0.15s, border-left 0.15s;
    }
    .meeting-item:hover { background: #22224a; }
    .meeting-item.active { background: #2a2a5a; border-left: 3px solid #4a4aff; }
    .meeting-item .title {
      font-size: 14px;
      font-weight: 500;
      color: #e0e0ff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meeting-item .meta {
      font-size: 11px;
      color: #777;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .meeting-item .meta .badge {
      padding: 2px 6px;
      border-radius: 3px;
      background: #2a2a4a;
      color: #aaa;
      font-size: 10px;
      text-transform: uppercase;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #555;
    }
    .empty-state p { font-size: 14px; margin-top: 12px; }

    /* Detail view */
    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .detail-title {
      font-size: 22px;
      font-weight: 600;
      color: #e0e0ff;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 2px 6px;
      margin: -2px -6px;
      transition: border-color 0.2s, background 0.2s;
    }
    .detail-title:hover { border-color: #3a3a5a; background: #1a1a2e; }
    .detail-title-input {
      font-size: 22px;
      font-weight: 600;
      color: #e0e0ff;
      background: #1a1a2e;
      border: 1px solid #4a4aff;
      border-radius: 4px;
      padding: 2px 6px;
      margin: -2px -6px;
      outline: none;
      width: 100%;
    }
    .detail-meta {
      font-size: 12px;
      color: #777;
      margin-top: 6px;
      display: flex;
      gap: 16px;
    }
    .detail-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid #2a2a4a;
    }
    .tab {
      padding: 10px 18px;
      font-size: 13px;
      color: #888;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab:hover { color: #ccc; }
    .tab.active { color: #a0a0ff; border-bottom-color: #4a4aff; }

    .tab-content { display: none; opacity: 0; transition: opacity 0.2s; }
    .tab-content.active { display: block; opacity: 1; }

    .transcript-box {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 20px;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: calc(100vh - 300px);
      overflow-y: auto;
      color: #ccc;
    }
    .transcript-box .speaker { color: #a0a0ff; font-weight: 500; }
    .transcript-box .timestamp { color: #666; font-size: 11px; }

    .transcript-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 0;
      font-size: 13px;
      color: #888;
    }
    .transcript-pagination button { min-width: 80px; }

    .summary-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .summary-card h3 {
      font-size: 12px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .summary-card p, .summary-card li {
      font-size: 13px;
      line-height: 1.6;
      color: #ccc;
    }
    .summary-card ul { list-style: none; padding: 0; }
    .summary-card li::before { content: "\2022 "; color: #4a4aff; }

    /* Editable summary */
    .summary-editable {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 4px;
      color: #ccc;
      font-size: 13px;
      line-height: 1.6;
      width: 100%;
      min-height: 60px;
      resize: vertical;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }
    .summary-editable:hover { border-color: #3a3a5a; }
    .summary-editable:focus { border-color: #4a4aff; background: #12122a; outline: none; }

    .summary-list-editable {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 4px;
      color: #ccc;
      font-size: 13px;
      line-height: 1.8;
      width: 100%;
      min-height: 40px;
      resize: vertical;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }
    .summary-list-editable:hover { border-color: #3a3a5a; }
    .summary-list-editable:focus { border-color: #4a4aff; background: #12122a; outline: none; }

    .audio-player { width: 100%; margin: 16px 0; border-radius: 8px; }
    audio { width: 100%; height: 40px; }

    /* Summarize controls */
    .summarize-controls {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .summarize-controls label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
    .summarize-controls select, .summarize-controls textarea {
      width: 100%;
      padding: 8px 12px;
      background: #2a2a4a;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .summarize-controls select:focus, .summarize-controls textarea:focus { border-color: #4a4aff; }
    .summarize-controls textarea { resize: vertical; min-height: 60px; }
    .summarize-row { display: flex; gap: 10px; align-items: flex-end; }
    .summarize-row > div { flex: 1; }

    /* Streaming indicator */
    .streaming-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #4a4aff;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .streaming-dot {
      width: 8px;
      height: 8px;
      background: #4a4aff;
      border-radius: 50%;
      animation: pulse 1s ease-in-out infinite;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal {
      background: #1a1a2e;
      border: 1px solid #3a3a5a;
      border-radius: 12px;
      padding: 28px;
      width: 500px;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      transform: scale(0.95);
      transition: transform 0.2s;
    }
    .modal-overlay.active .modal { transform: scale(1); }
    .modal h2 { font-size: 18px; color: #e0e0ff; margin-bottom: 16px; }
    .modal label { font-size: 13px; color: #aaa; display: block; margin-bottom: 6px; }
    .modal input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #2a2a4a;
      border: 1px dashed #4a4aff;
      border-radius: 6px;
      color: #ccc;
      margin-bottom: 14px;
    }
    .modal input[type="text"], .modal select, .modal textarea {
      width: 100%;
      padding: 8px 12px;
      background: #2a2a4a;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      margin-bottom: 14px;
      font-family: inherit;
    }
    .modal textarea { min-height: 80px; resize: vertical; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

    /* Settings sections */
    .settings-section { margin-bottom: 20px; }
    .settings-section h3 { font-size: 14px; color: #a0a0ff; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #2a2a4a; }
    .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
    .settings-row label { font-size: 13px; color: #ccc; flex: 1; }
    .settings-row input, .settings-row select { width: 200px; }

    .stats-bar {
      padding: 10px 18px;
      background: #16162a;
      border-bottom: 1px solid #22224a;
      font-size: 12px;
      color: #666;
      display: flex;
      gap: 20px;
    }
    .stats-bar span { color: #999; }

    .no-transcript {
      color: #555;
      font-style: italic;
      text-align: center;
      padding: 40px;
    }

    /* Toast notifications (Feature 10) */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }
    .toast {
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      color: white;
      min-width: 280px;
      max-width: 420px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      animation: toastIn 0.3s ease-out;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.toast-exit { animation: toastOut 0.3s ease-in forwards; }
    .toast-success { background: #1a6b3a; border: 1px solid #2a8b4a; }
    .toast-error { background: #7a1a1a; border: 1px solid #9a2a2a; }
    .toast-info { background: #1a3a6b; border: 1px solid #2a4a8b; }
    .toast-close { background: none; border: none; color: rgba(255,255,255,0.7); cursor: pointer; font-size: 16px; margin-left: auto; }
    .toast-close:hover { color: white; }

    /* Copy feedback */
    .copy-feedback {
      font-size: 11px;
      color: #4a4aff;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .copy-feedback.show { opacity: 1; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f0f1a; }
    ::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Finrep Meeting Intelligence</h1>
    <div class="header-actions">
      <input type="text" class="search-box" id="search-input" placeholder="Search transcripts..." />
      <select class="filter-select" id="filter-type">
        <option value="">All Types</option>
        <option value="internal">Internal</option>
        <option value="customer">Customer</option>
        <option value="gtm">GTM</option>
        <option value="product">Product</option>
      </select>
      <button class="btn btn-secondary" id="btn-settings" title="Settings">Settings</button>
      <button class="btn btn-primary" id="btn-import" title="Import audio file">Import Audio</button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="stats-bar" id="stats-bar">
        <span id="total-count">0 meetings</span>
      </div>
      <div id="meeting-list"></div>
    </div>
    <div class="content" id="detail-content">
      <div class="empty-state" id="empty-state">
        <p>Select a meeting to view details</p>
      </div>
      <div id="meeting-detail" style="display: none;"></div>
    </div>
  </div>

  <!-- Import Modal -->
  <div class="modal-overlay" id="import-modal">
    <div class="modal">
      <h2>Import Audio File</h2>
      <label for="import-file">Audio File (MP3, WAV, WebM, OGG, M4A, FLAC)</label>
      <input type="file" id="import-file" accept="audio/*,video/webm,video/mp4" />
      <label for="import-title">Meeting Title (optional)</label>
      <input type="text" id="import-title" placeholder="e.g. Team Standup 2025-01-15" />
      <label for="import-speakers">Number of Speakers (optional)</label>
      <input type="text" id="import-speakers" placeholder="Leave blank for auto-detect" />
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btn-import-cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-import-submit">Upload & Transcribe</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal (Feature 9) -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal" style="width:560px;">
      <h2>Settings</h2>
      <div class="settings-section">
        <h3>Summarization</h3>
        <div class="settings-row">
          <label>Default Template</label>
          <select id="setting-default-template">
            <option value="default">Default</option>
            <option value="standup">Standup</option>
            <option value="customer">Customer Call</option>
            <option value="product">Product Review</option>
          </select>
        </div>
        <div class="settings-row">
          <label>Default Custom Prompt</label>
        </div>
        <textarea id="setting-custom-prompt" placeholder="Optional custom instructions for all summaries..." style="width:100%;padding:8px 12px;background:#2a2a4a;border:1px solid #3a3a5a;border-radius:6px;color:#e0e0e0;font-size:13px;min-height:60px;font-family:inherit;resize:vertical;"></textarea>
      </div>
      <div class="settings-section">
        <h3>Display</h3>
        <div class="settings-row">
          <label>Transcript Lines Per Page</label>
          <select id="setting-lines-per-page">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
            <option value="500">500</option>
            <option value="0">All (no pagination)</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('settings-modal')">Cancel</button>
        <button class="btn btn-primary" id="btn-settings-save">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- Toast container (Feature 10) -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    const API = '/api';
    let meetings = [];
    let selectedId = null;
    let searchTimeout = null;
    let currentMeeting = null;
    let transcriptPage = 0;
    let settings = { defaultTemplate: 'default', customPrompt: '', linesPerPage: 100 };

    // ---- Toast Notifications (Feature 10) ----
    function toast(message, type = 'info', duration = 3500) {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.innerHTML = `<span>${escapeHtml(message)}</span><button class="toast-close" onclick="this.parentElement.remove()">&times;</button>`;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('toast-exit');
        setTimeout(() => el.remove(), 300);
      }, duration);
    }

    // ---- Settings ----
    async function loadSettings() {
      try {
        const res = await fetch(`${API}/settings`);
        const data = await res.json();
        if (data.settings) {
          settings.defaultTemplate = data.settings.defaultTemplate || 'default';
          settings.customPrompt = data.settings.customPrompt || '';
          settings.linesPerPage = parseInt(data.settings.linesPerPage) || 100;
        }
      } catch (e) { /* use defaults */ }
    }

    async function saveSettings() {
      settings.defaultTemplate = document.getElementById('setting-default-template').value;
      settings.customPrompt = document.getElementById('setting-custom-prompt').value;
      settings.linesPerPage = parseInt(document.getElementById('setting-lines-per-page').value) || 100;

      try {
        await fetch(`${API}/settings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ settings: {
            defaultTemplate: settings.defaultTemplate,
            customPrompt: settings.customPrompt,
            linesPerPage: String(settings.linesPerPage),
          }}),
        });
        closeModal('settings-modal');
        toast('Settings saved', 'success');
      } catch (err) {
        toast('Failed to save settings: ' + err.message, 'error');
      }
    }

    function openSettings() {
      document.getElementById('setting-default-template').value = settings.defaultTemplate;
      document.getElementById('setting-custom-prompt').value = settings.customPrompt;
      document.getElementById('setting-lines-per-page').value = String(settings.linesPerPage);
      openModal('settings-modal');
    }

    // ---- Modal helpers ----
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // ---- Load meetings ----
    async function loadMeetings(callType = '', searchQuery = '') {
      try {
        let url;
        if (searchQuery) {
          url = `${API}/meetings/search?q=${encodeURIComponent(searchQuery)}`;
        } else {
          url = `${API}/meetings${callType ? '?callType=' + callType : ''}`;
        }
        const res = await fetch(url);
        const data = await res.json();
        meetings = data.meetings || [];
        renderMeetingList();
      } catch (err) {
        console.error('Failed to load meetings:', err);
        toast('Failed to load meetings', 'error');
      }
    }

    function renderMeetingList() {
      const list = document.getElementById('meeting-list');
      document.getElementById('total-count').textContent = `${meetings.length} meeting${meetings.length !== 1 ? 's' : ''}`;

      if (meetings.length === 0) {
        list.innerHTML = '<div style="padding:40px;text-align:center;color:#555;">No meetings found</div>';
        return;
      }

      list.innerHTML = meetings.map(m => {
        const title = m.title || m.meet_title || 'Untitled Meeting';
        const date = m.created_at ? new Date(m.created_at + 'Z').toLocaleDateString('en-IN', {
          day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : '';
        const duration = m.duration_seconds
          ? `${Math.floor(m.duration_seconds / 60)}m`
          : '';
        const hasTranscript = m.transcript ? 'yes' : 'no';
        const callBadge = m.call_type
          ? `<span class="badge">${m.call_type}</span>`
          : '';

        return `
          <div class="meeting-item slide-in ${m.id === selectedId ? 'active' : ''}" data-id="${m.id}">
            <div class="title">${escapeHtml(title)}</div>
            <div class="meta">
              <span>${date}</span>
              ${duration ? `<span>${duration}</span>` : ''}
              ${callBadge}
              ${hasTranscript === 'no' ? '<span style="color:#885;">No transcript</span>' : ''}
            </div>
          </div>
        `;
      }).join('');

      list.querySelectorAll('.meeting-item').forEach(el => {
        el.addEventListener('click', () => selectMeeting(el.dataset.id));
      });
    }

    // ---- Select & render meeting detail ----
    async function selectMeeting(id) {
      selectedId = id;
      renderMeetingList();

      const res = await fetch(`${API}/meetings/${id}`);
      const data = await res.json();
      currentMeeting = data.meeting;
      const m = currentMeeting;

      document.getElementById('empty-state').style.display = 'none';
      const detail = document.getElementById('meeting-detail');
      detail.style.display = 'block';

      transcriptPage = 0;
      renderDetail(m, detail);
    }

    function renderDetail(m, detail) {
      const title = m.title || m.meet_title || 'Untitled Meeting';
      const date = m.created_at ? new Date(m.created_at + 'Z').toLocaleDateString('en-IN', {
        weekday: 'short', day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      }) : '';
      const duration = m.duration_seconds
        ? `${Math.floor(m.duration_seconds / 60)}m ${m.duration_seconds % 60}s`
        : '';

      let transcriptHtml = '';
      let paginationHtml = '';
      if (m.transcript) {
        const result = formatTranscriptPaginated(m.transcript, transcriptPage);
        transcriptHtml = result.html;
        paginationHtml = result.pagination;
      }

      const summaryHtml = renderSummaryEditable(m.summary);

      detail.innerHTML = `
        <div class="detail-header fade-in">
          <div style="flex:1;min-width:0;">
            <div class="detail-title" id="detail-title" onclick="startEditTitle()">${escapeHtml(title)}</div>
            <div class="detail-meta">
              <span>${date}</span>
              ${duration ? `<span>${duration}</span>` : ''}
              ${m.call_type ? `<span style="text-transform:uppercase">${m.call_type}</span>` : ''}
              ${m.meet_url ? `<span><a href="${escapeHtml(m.meet_url)}" target="_blank" style="color:#7070ff">Meet Link</a></span>` : ''}
            </div>
          </div>
          <div class="detail-actions">
            <button class="btn btn-secondary btn-sm" onclick="copyTranscript()" title="Copy transcript">Copy Transcript</button>
            <button class="btn btn-secondary btn-sm" onclick="copySummary()" title="Copy summary">Copy Summary</button>
            <button class="btn btn-secondary btn-sm" onclick="downloadAll('${m.id}')" title="Download all files">Download All</button>
            <button class="btn btn-secondary btn-sm" onclick="exportMeeting('${m.id}', 'txt')">Export TXT</button>
            <button class="btn btn-secondary btn-sm" onclick="exportMeeting('${m.id}', 'json')">Export JSON</button>
            <button class="btn btn-secondary btn-sm" onclick="retranscribe('${m.id}')">Re-transcribe</button>
            <button class="btn btn-danger btn-sm" onclick="deleteMeeting('${m.id}')">Delete</button>
          </div>
        </div>

        ${m.audio_path ? `
          <div class="audio-player fade-in">
            <audio controls preload="metadata" src="${API}/meetings/${m.id}/audio"></audio>
          </div>
        ` : ''}

        <div class="tabs">
          <div class="tab active" data-tab="transcript">Transcript</div>
          <div class="tab" data-tab="summary">Summary</div>
        </div>

        <div class="tab-content active" data-tab="transcript">
          ${m.transcript
            ? `<div class="transcript-box slide-up">${transcriptHtml}</div>${paginationHtml}`
            : '<div class="no-transcript">No transcript available</div>'
          }
        </div>

        <div class="tab-content" data-tab="summary">
          <!-- Summarize controls (Features 3, 8, 13) -->
          <div class="summarize-controls slide-up">
            <div class="summarize-row">
              <div>
                <label>Template</label>
                <select id="summary-template">
                  <option value="default">Default</option>
                  <option value="standup">Standup</option>
                  <option value="customer">Customer Call</option>
                  <option value="product">Product Review</option>
                </select>
              </div>
              <div style="flex:0 0 auto;padding-bottom:10px;">
                <button class="btn btn-primary btn-sm" id="btn-summarize" onclick="runSummarize('${m.id}')">
                  ${m.summary ? 'Re-summarize' : 'Summarize'}
                </button>
                <button class="btn btn-secondary btn-sm" id="btn-summarize-stream" onclick="runSummarizeStream('${m.id}')">
                  Stream
                </button>
              </div>
            </div>
            <label>Custom Prompt (optional)</label>
            <textarea id="summary-custom-prompt" placeholder="Add specific instructions for this summary...">${escapeHtml(settings.customPrompt)}</textarea>
          </div>

          <div id="summary-content">
            ${summaryHtml || '<div class="no-transcript">No summary available — use the controls above to generate one</div>'}
          </div>
          <div id="streaming-output" style="display:none;">
            <div class="summary-card">
              <h3><span class="streaming-indicator"><span class="streaming-dot"></span> Generating summary...</span></h3>
              <pre id="streaming-text" style="white-space:pre-wrap;color:#ccc;font-size:13px;line-height:1.6;font-family:inherit;"></pre>
            </div>
          </div>
        </div>
      `;

      // Set template default
      const templateSelect = document.getElementById('summary-template');
      if (templateSelect) templateSelect.value = settings.defaultTemplate;

      // Tab switching
      detail.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          detail.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          detail.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          detail.querySelector(`.tab-content[data-tab="${tab.dataset.tab}"]`).classList.add('active');
        });
      });
    }

    // ---- Editable Title (Feature 2) ----
    function startEditTitle() {
      const el = document.getElementById('detail-title');
      const currentTitle = currentMeeting.title || currentMeeting.meet_title || '';
      el.outerHTML = `<input class="detail-title-input" id="detail-title-input" value="${escapeHtml(currentTitle)}" onblur="saveTitle()" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.dataset.cancel='1';this.blur()}" />`;
      const input = document.getElementById('detail-title-input');
      input.focus();
      input.select();
    }

    async function saveTitle() {
      const input = document.getElementById('detail-title-input');
      if (!input) return;
      if (input.dataset.cancel === '1') {
        selectMeeting(selectedId);
        return;
      }
      const newTitle = input.value.trim();
      if (!newTitle) {
        selectMeeting(selectedId);
        return;
      }
      try {
        await fetch(`${API}/meetings/${selectedId}/title`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle }),
        });
        toast('Title updated', 'success');
        currentMeeting.title = newTitle;
        currentMeeting.meet_title = newTitle;
        loadMeetings(document.getElementById('filter-type').value);
        selectMeeting(selectedId);
      } catch (err) {
        toast('Failed to update title: ' + err.message, 'error');
      }
    }

    // ---- Editable Summary (Feature 1) ----
    function renderSummaryEditable(s) {
      if (!s) return '';
      let html = '';
      html += `<div class="summary-card slide-up">
        <h3>Summary <button class="btn-icon" onclick="saveSummaryEdits()" title="Save edits">Save</button></h3>
        <textarea class="summary-editable" data-field="summary">${escapeHtml(s.summary || '')}</textarea>
      </div>`;

      const listSections = [
        { key: 'decisions', label: 'Key Decisions' },
        { key: 'actionItems', label: 'Action Items' },
        { key: 'followUps', label: 'Follow-ups' },
        { key: 'nextSteps', label: 'Next Steps' },
        { key: 'deadlines', label: 'Deadlines' },
      ];

      for (const sec of listSections) {
        if (s[sec.key]?.length) {
          html += `<div class="summary-card slide-up">
            <h3>${sec.label}</h3>
            <textarea class="summary-list-editable" data-field="${sec.key}" rows="${Math.min(s[sec.key].length + 1, 8)}">${s[sec.key].map(i => escapeHtml(i)).join('\n')}</textarea>
          </div>`;
        }
      }

      if (s.participants?.length) {
        html += `<div class="summary-card slide-up">
          <h3>Participants</h3>
          <textarea class="summary-list-editable" data-field="participants" rows="2">${s.participants.map(p => escapeHtml(p)).join('\n')}</textarea>
        </div>`;
      }

      return html;
    }

    async function saveSummaryEdits() {
      if (!currentMeeting?.summary) return;

      const summaryText = document.querySelector('.summary-editable[data-field="summary"]');
      const updated = { ...currentMeeting.summary };
      if (summaryText) updated.summary = summaryText.value;

      document.querySelectorAll('.summary-list-editable').forEach(ta => {
        const field = ta.dataset.field;
        updated[field] = ta.value.split('\n').map(l => l.trim()).filter(l => l);
      });

      try {
        const res = await fetch(`${API}/meetings/${selectedId}/summary`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ summary: updated }),
        });
        if (!res.ok) throw new Error('Save failed');
        currentMeeting.summary = updated;
        toast('Summary saved', 'success');
      } catch (err) {
        toast('Failed to save summary: ' + err.message, 'error');
      }
    }

    // ---- Transcript Pagination (Feature 6) ----
    function formatTranscriptPaginated(text, page) {
      const lines = text.split('\n');
      const lpp = settings.linesPerPage;
      let displayLines, pagination = '';

      if (lpp === 0 || lpp >= lines.length) {
        displayLines = lines;
      } else {
        const totalPages = Math.ceil(lines.length / lpp);
        const start = page * lpp;
        const end = Math.min(start + lpp, lines.length);
        displayLines = lines.slice(start, end);
        pagination = `
          <div class="transcript-pagination">
            <button class="btn btn-secondary btn-sm" onclick="changePage(-1)" ${page === 0 ? 'disabled' : ''}>Previous</button>
            <span>Page ${page + 1} of ${totalPages} (${lines.length} lines)</span>
            <button class="btn btn-secondary btn-sm" onclick="changePage(1)" ${page >= totalPages - 1 ? 'disabled' : ''}>Next</button>
          </div>
        `;
      }

      const html = displayLines.map(line => {
        return escapeHtml(line)
          .replace(/^(\[[\d:]+\])/g, '<span class="timestamp">$1</span>')
          .replace(/(SPEAKER_\d+):/g, '<span class="speaker">$1:</span>');
      }).join('\n');

      return { html, pagination };
    }

    function changePage(delta) {
      if (!currentMeeting?.transcript) return;
      const lines = currentMeeting.transcript.split('\n');
      const lpp = settings.linesPerPage;
      if (lpp === 0) return;
      const totalPages = Math.ceil(lines.length / lpp);
      transcriptPage = Math.max(0, Math.min(transcriptPage + delta, totalPages - 1));
      renderDetail(currentMeeting, document.getElementById('meeting-detail'));
    }

    // ---- Copy to Clipboard (Feature 5) ----
    async function copyTranscript() {
      if (!currentMeeting?.transcript) {
        toast('No transcript to copy', 'error');
        return;
      }
      try {
        await navigator.clipboard.writeText(currentMeeting.transcript);
        toast('Transcript copied to clipboard', 'success');
      } catch (e) {
        toast('Copy failed', 'error');
      }
    }

    async function copySummary() {
      if (!currentMeeting?.summary) {
        toast('No summary to copy', 'error');
        return;
      }
      const s = currentMeeting.summary;
      let text = `Summary: ${s.summary || ''}\n`;
      if (s.decisions?.length) text += `\nKey Decisions:\n${s.decisions.map(d => `  - ${d}`).join('\n')}\n`;
      if (s.actionItems?.length) text += `\nAction Items:\n${s.actionItems.map(a => `  - ${a}`).join('\n')}\n`;
      if (s.followUps?.length) text += `\nFollow-ups:\n${s.followUps.map(f => `  - ${f}`).join('\n')}\n`;
      if (s.nextSteps?.length) text += `\nNext Steps:\n${s.nextSteps.map(n => `  - ${n}`).join('\n')}\n`;
      if (s.deadlines?.length) text += `\nDeadlines:\n${s.deadlines.map(d => `  - ${d}`).join('\n')}\n`;

      try {
        await navigator.clipboard.writeText(text);
        toast('Summary copied to clipboard', 'success');
      } catch (e) {
        toast('Copy failed', 'error');
      }
    }

    // ---- Download All (Feature 11) ----
    function downloadAll(id) {
      window.open(`${API}/meetings/${id}/download`, '_blank');
      toast('Downloading meeting files...', 'info');
    }

    // ---- Export ----
    function exportMeeting(id, format) {
      window.open(`${API}/meetings/${id}/export?format=${format}`, '_blank');
    }

    // ---- Summarize (Features 3, 8, 13) ----
    async function runSummarize(meetingId) {
      const template = document.getElementById('summary-template')?.value || 'default';
      const customPrompt = document.getElementById('summary-custom-prompt')?.value || '';

      const btn = document.getElementById('btn-summarize');
      btn.disabled = true;
      btn.textContent = 'Summarizing...';

      try {
        const res = await fetch(`${API}/summarize`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ meetingId, template, customPrompt }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        currentMeeting.summary = data.summary;
        document.getElementById('summary-content').innerHTML = renderSummaryEditable(data.summary);
        toast('Summary generated!', 'success');
      } catch (err) {
        toast('Summarization failed: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = currentMeeting.summary ? 'Re-summarize' : 'Summarize';
      }
    }

    // ---- Streaming Summarize (Feature 8) ----
    async function runSummarizeStream(meetingId) {
      const template = document.getElementById('summary-template')?.value || 'default';
      const customPrompt = document.getElementById('summary-custom-prompt')?.value || '';

      const btn = document.getElementById('btn-summarize-stream');
      btn.disabled = true;
      btn.textContent = 'Streaming...';

      document.getElementById('summary-content').style.display = 'none';
      const streamOutput = document.getElementById('streaming-output');
      const streamText = document.getElementById('streaming-text');
      streamOutput.style.display = 'block';
      streamText.textContent = '';

      try {
        const params = new URLSearchParams({ meetingId, template, customPrompt });
        const evtSource = new EventSource(`${API}/summarize/stream?${params}`);

        evtSource.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === 'chunk') {
            streamText.textContent += data.text;
            streamText.scrollTop = streamText.scrollHeight;
          } else if (data.type === 'done') {
            evtSource.close();
            currentMeeting.summary = data.summary;
            streamOutput.style.display = 'none';
            document.getElementById('summary-content').style.display = 'block';
            document.getElementById('summary-content').innerHTML = renderSummaryEditable(data.summary);
            toast('Summary generated (streamed)!', 'success');
            btn.disabled = false;
            btn.textContent = 'Stream';
          } else if (data.type === 'error') {
            evtSource.close();
            toast('Streaming error: ' + data.error, 'error');
            streamOutput.style.display = 'none';
            document.getElementById('summary-content').style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Stream';
          }
        };

        evtSource.onerror = () => {
          evtSource.close();
          toast('Stream connection lost', 'error');
          streamOutput.style.display = 'none';
          document.getElementById('summary-content').style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Stream';
        };
      } catch (err) {
        toast('Streaming failed: ' + err.message, 'error');
        streamOutput.style.display = 'none';
        document.getElementById('summary-content').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Stream';
      }
    }

    // ---- Re-transcribe ----
    async function retranscribe(id) {
      const numSpeakers = prompt('Number of speakers (leave blank for auto-detect):', '');
      const body = { meetingId: id };
      if (numSpeakers) body.numSpeakers = parseInt(numSpeakers, 10);

      try {
        toast('Re-transcribing... this may take a few minutes', 'info', 10000);
        const res = await fetch(`${API}/transcribe/retranscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        toast('Re-transcription complete!', 'success');
        selectMeeting(id);
      } catch (err) {
        toast('Re-transcription failed: ' + err.message, 'error');
      }
    }

    // ---- Delete Meeting (Feature 16) ----
    async function deleteMeeting(id) {
      if (!confirm('Are you sure you want to delete this meeting? This cannot be undone.')) return;

      try {
        const res = await fetch(`${API}/meetings/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        toast('Meeting deleted', 'success');
        selectedId = null;
        currentMeeting = null;
        document.getElementById('meeting-detail').style.display = 'none';
        document.getElementById('empty-state').style.display = 'flex';
        loadMeetings(document.getElementById('filter-type').value);
      } catch (err) {
        toast('Failed to delete: ' + err.message, 'error');
      }
    }

    // ---- Utility ----
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ---- Import ----
    document.getElementById('btn-import').addEventListener('click', () => openModal('import-modal'));
    document.getElementById('btn-import-cancel').addEventListener('click', () => closeModal('import-modal'));
    document.getElementById('btn-import-submit').addEventListener('click', async () => {
      const fileInput = document.getElementById('import-file');
      const titleInput = document.getElementById('import-title');
      const speakersInput = document.getElementById('import-speakers');
      const btn = document.getElementById('btn-import-submit');

      if (!fileInput.files.length) {
        toast('Please select an audio file', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Uploading...';

      try {
        const formData = new FormData();
        formData.append('audio', fileInput.files[0]);
        if (titleInput.value) formData.append('meetTitle', titleInput.value);

        const uploadRes = await fetch(`${API}/upload`, { method: 'POST', body: formData });
        const uploadData = await uploadRes.json();
        if (!uploadRes.ok) throw new Error(uploadData.error);

        const meetingId = uploadData.meetingId;
        btn.textContent = 'Transcribing...';
        toast('Upload complete, transcribing...', 'info');

        const transcribeBody = { meetingId };
        if (speakersInput.value) transcribeBody.numSpeakers = parseInt(speakersInput.value, 10);

        const transRes = await fetch(`${API}/transcribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(transcribeBody),
        });
        const transData = await transRes.json();
        if (!transRes.ok) throw new Error(transData.error);

        closeModal('import-modal');
        fileInput.value = '';
        titleInput.value = '';
        speakersInput.value = '';

        toast('Import complete!', 'success');
        await loadMeetings();
        selectMeeting(meetingId);
      } catch (err) {
        toast('Import failed: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Upload & Transcribe';
      }
    });

    // ---- Search ----
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const query = e.target.value.trim();
        const callType = document.getElementById('filter-type').value;
        if (query.length > 0) {
          loadMeetings('', query);
        } else {
          loadMeetings(callType);
        }
      }, 400);
    });

    document.getElementById('filter-type').addEventListener('change', (e) => {
      const search = document.getElementById('search-input').value.trim();
      if (!search) {
        loadMeetings(e.target.value);
      }
    });

    // ---- Settings button ----
    document.getElementById('btn-settings').addEventListener('click', openSettings);
    document.getElementById('btn-settings-save').addEventListener('click', saveSettings);

    // ---- Close modals on overlay click ----
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('active');
      });
    });

    // ---- Keyboard shortcut: Escape closes modals ----
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
      }
    });

    // ---- Init ----
    (async () => {
      await loadSettings();
      loadMeetings();
    })();
  </script>
</body>
</html>
